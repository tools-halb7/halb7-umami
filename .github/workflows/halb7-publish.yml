name: halb7 - Build and publish Umami image

on:
  push:
    branches: [halb7-utm]
  workflow_dispatch:

jobs:
  build:
    name: Build, push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tools-halb7/halb7-umami:v3.1.0-utm
          cache-from: type=gha
          cache-to: type=gha,mode=max
